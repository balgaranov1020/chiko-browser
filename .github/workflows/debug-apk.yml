name: Debug APK (no signing required)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'artifacts/mobile-browser/**'
      - '.github/workflows/debug-apk.yml'

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets for Android
        working-directory: artifacts/mobile-browser
        run: pnpm vite build --config vite.android.config.ts

      - name: Sync Capacitor
        working-directory: artifacts/mobile-browser
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        working-directory: artifacts/mobile-browser/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: artifacts/mobile-browser/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chiko-browser-debug-${{ github.run_number }}
          path: artifacts/mobile-browser/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build summary
        run: |
          APK=artifacts/mobile-browser/android/app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(du -sh "$APK" 2>/dev/null | cut -f1 || echo "unknown")
          echo "## Chiko Browser - Debug APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install instructions" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifact below and unzip it" >> $GITHUB_STEP_SUMMARY
          echo "2. Via USB: adb install app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "3. On phone: transfer the APK, enable 'Install unknown apps', tap to install" >> $GITHUB_STEP_SUMMARY
